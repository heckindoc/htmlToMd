plugins {
    id 'java-library'
    id 'maven-publish'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

group = 'com.github.heckindoc'
version = '1.0.1'

repositories {
    mavenCentral()
}

dependencies {
    // jsoup HTML parser library @ https://jsoup.org/
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation("org.commonmark:commonmark:0.30.0")
}

test {
    useJUnitPlatform()
}