plugins {
    id 'java-library'
}

group = 'org.heckindoc.htmltomdconverter'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    // jsoup HTML parser library @ https://jsoup.org/
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation("org.commonmark:commonmark:0.30.0")
}

test {
    useJUnitPlatform()
}